; Firmware del equipo LlaveTrack (ESP32).
;   Compilar:  pio run
;   Cargar:    pio run -t upload
;   Monitor:   pio device monitor
; Versiones fijas: la plataforma y las librerias no cambian solas entre una compilacion y otra.

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes   ; que se vea lo que se escribe en el Monitor Serie
monitor_eol = LF     ; Enter manda la linea (los comandos se leen por linea)
lib_deps =
  miguelbalboa/MFRC522@1.4.12
  marcoschwartz/LiquidCrystal_I2C@1.1.4
  chris--a/Keypad@3.1.1
